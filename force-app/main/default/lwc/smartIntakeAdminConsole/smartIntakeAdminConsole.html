                                            <span>{configPlan.metadataWriteStatus}</span>
                                        </div>
                                        <div class="builder-plan__notice">{configPlan.metadataWriteNotice}</div>
                                        <template if:true={hasConfigIssues}>
                                            <div class="issues-list builder-plan__issues" role="status">
                                                <template for:each={configPlan.issues} for:item="issue">
                                                    <article key={issue.key} class={issue.className}>
                                                        <div class="issue__header">
                                                            <span class="issue__severity">{issue.severity}</span>
                                                            <span class="issue__code">{issue.code}</span>
                                                        </div>
                                                        <div class="issue__target">{issue.componentType}: {issue.componentKey}</div>
                                                        <div class="issue__message">{issue.message}</div>
                                                    </article>
                                                </template>
                                            </div>
                                        </template>
                                        <template if:true={configPlan.hasDeploymentStatus}>
                                            <div class="deployment-status" aria-label="Channel deployment status">
                                                <div class="deployment-status__header">
                                                    <span>{configPlan.deploymentStatus.statusLabel}</span>
                                                    <code>{configPlan.deploymentStatus.deploymentJobId}</code>
                                                </div>
                                                <div class="deployment-status__bar" aria-label="Deployment progress">
                                                    <span style={configPlan.deploymentStatus.progressStyle}></span>
                                                </div>
                                                <div class="deployment-status__meta">
                                                    <span>{configPlan.deploymentStatus.componentProgressLabel}</span>
                                                    <span>{configPlan.deploymentStatus.testProgressLabel}</span>
                                                </div>
                                            </div>
                                        </template>
                                    </section>
                                </template>
                            </section>
                        </div>
                    </section>
                </template>

                <template if:true={isTestTab}>
                    <section class="workspace" aria-label="Test">
                        <section class="panel-block">
                            <div class="section-heading">
                                <div>
                                    <h2>Readiness Check</h2>
                                    <p>Re-run validation before trying Enhanced Chat, WhatsApp, or the Agentforce preview CLI.</p>
                                </div>
                                <lightning-button label="Re-run validation" icon-name="utility:refresh" variant="brand" onclick={handleValidate} disabled={isLoading}></lightning-button>
                            </div>
                            <div class="readiness-summary">
                                <span><strong>{readinessPassedCount}</strong> passed</span>
                                <span><strong>{readinessWarningCount}</strong> warnings</span>
                                <span><strong>{readinessBlockedCount}</strong> blocked</span>
                            </div>
                        </section>

                        <div class="two-column">
                            <section class="panel-block">
                                <div class="section-heading">
                                    <div>
                                        <h2>Checklist</h2>
                                        <p>Readiness checks for the selected template.</p>
                                    </div>
                                </div>
                                <div class="stack-list">
                                    <template for:each={readinessItems} for:item="item">
                                        <article key={item.key} class={item.className}>
                                            <div class="readiness-item__header">
                                                <span>{item.label}</span>
                                                <span>{item.status}</span>
                                            </div>
                                            <div class="readiness-item__message">{item.message}</div>
                                        </article>
                                    </template>
                                </div>
                            </section>

                            <section class="panel-block">
                                <div class="section-heading">
                                    <div>
                                        <h2>Conversation Preview</h2>
                                        <p>Expected next question and answer shape.</p>
                                    </div>
                                </div>
                                <div class="chat-preview chat-preview_wide">
                                    <div class="chat-preview__bubble">SmartIntake joined.</div>
                                    <div class="chat-preview__card">
                                        <h3>{previewQuestionText}</h3>
                                        <p>{previewHelpText}</p>
                                        <div class="chat-preview__control">
                                            <span>{previewUiControl}</span>
                                            <strong>{previewInputType}</strong>
                                        </div>
                                    </div>
                                    <div class="chat-preview__meta">Answer saved under {builderDraft.questionKey}</div>
                                </div>
                            </section>
                        </div>
                    </section>
                </template>

                <template if:true={isAdvancedTab}>
                    <section class="workspace" aria-label="Advanced">
                        <div class="two-column">
                            <section class="panel-block">
	                                <div class="section-heading">
	                                    <div>
	                                        <h2>Custom Control Registry</h2>
	                                        <p>Generate static LWC imports from active questions that use direct c/... UI controls.</p>
	                                    </div>
	                                </div>
                                <div class="actions">
                                    <lightning-button label="Preview Registry" icon-name="utility:preview" onclick={handlePreviewCustomControlRegistry} disabled={isRegistryLoading}></lightning-button>
                                    <lightning-button label="Sync Registry" icon-name="utility:sync" variant="brand" onclick={handleDeploySyncClick} disabled={isRegistrySyncButtonDisabled}></lightning-button>
                                </div>
                                <template if:true={hasRegistryPlan}>
                                    <section class="plan-card" aria-label="Custom control registry plan">
                                        <div class={registryPlan.statusClass}>{registryPlan.statusLabel}</div>
                                        <div class="builder-plan__meta">
                                            <span>{registryPlan.recordCount} records</span>
                                            <span>{registryPlan.errorCount} errors</span>
                                            <span>{registryPlan.warningCount} warnings</span>
                                            <span>{registryPlan.metadataWriteStatus}</span>
                                        </div>
                                        <div class="builder-plan__notice">{registryPlan.metadataWriteNotice}</div>
                                        <template if:true={hasRegistryIssues}>
                                            <div class="issues-list" role="status">
                                                <template for:each={registryPlan.issues} for:item="issue">
                                                    <article key={issue.key} class={issue.className}>
                                                        <strong>{issue.componentType}</strong>
                                                        <span>{issue.message}</span>
                                                    </article>
                                                </template>
                                            </div>
                                        </template>
                                        <template if:true={registryPlan.hasDeploymentStatus}>
                                            <div class="deployment-status" aria-label="Registry deployment status">
                                                <div class="deployment-status__header">
                                                    <span>{registryPlan.deploymentStatus.statusLabel}</span>
                                                    <code>{registryPlan.deploymentStatus.deploymentJobId}</code>
                                                </div>
                                                <div class="deployment-status__bar" aria-label="Deployment progress">
                                                    <span style={registryPlan.deploymentStatus.progressStyle}></span>
                                                </div>
                                                <div class="deployment-status__meta">
                                                    <span>{registryPlan.deploymentStatus.componentProgressLabel}</span>
                                                    <span>{registryPlan.deploymentStatus.testProgressLabel}</span>
                                                </div>
                                            </div>
                                        </template>
                                    </section>
                                </template>
                            </section>

                            <section class="panel-block">
                                <div class="section-heading">
                                    <div>
                                        <h2>Template Shortcut</h2>
                                        <p>Create another starter template without leaving this workspace.</p>
                                    </div>
                                </div>
                                <lightning-button label="New Template" icon-name="utility:add" variant="brand" onclick={handleNewTemplate}></lightning-button>
                            </section>
                        </div>

                        <section class="panel-block configuration" aria-label="Template configuration">
                            <div class="section-heading">
                                <div>
                                    <h2>Metadata Explorer</h2>
                                    <p>Read-only view of the records currently driving this template.</p>
                                </div>
                            </div>
                            <template if:true={isConfigurationLoading}>
                                <div class="centered">
                                    <lightning-spinner alternative-text="Loading template metadata" size="small"></lightning-spinner>
                                </div>
                            </template>
                            <template if:true={hasDeletePlan}>
                                <section class="plan-card" aria-label="Delete metadata plan">
                                    <div class={deletePlan.statusClass}>{deletePlan.statusLabel}</div>
                                    <div class="builder-plan__meta">
                                        <span>{deletePlan.recordCount} records</span>
                                        <span>{deletePlan.errorCount} errors</span>
                                        <span>{deletePlan.warningCount} warnings</span>
                                        <span>{deletePlan.metadataWriteStatus}</span>
                                    </div>
                                    <div class="builder-plan__notice">{deletePlan.metadataWriteNotice}</div>
                                    <template if:true={deletePlan.hasDeploymentStatus}>
                                        <div class="deployment-status" aria-label="Delete deployment status">
                                            <div class="deployment-status__header">
                                                <span>{deletePlan.deploymentStatus.statusLabel}</span>
                                                <code>{deletePlan.deploymentStatus.deploymentJobId}</code>
                                            </div>
                                            <div class="deployment-status__bar" aria-label="Deployment progress">
                                                <span style={deletePlan.deploymentStatus.progressStyle}></span>
                                            </div>
                                            <div class="deployment-status__meta">
                                                <span>{deletePlan.deploymentStatus.componentProgressLabel}</span>
                                                <span>{deletePlan.deploymentStatus.testProgressLabel}</span>
                                            </div>
                                        </div>
                                    </template>
                                </section>
                            </template>
                            <template if:true={hasConfiguration}>
                                <div class="config-sections">
                                    <template for:each={configurationSections} for:item="section">
                                        <section key={section.key} class="config-section">
                                            <h3>{section.displayLabel}</h3>
                                            <template if:true={section.hasRecords}>
                                                <template for:each={section.records} for:item="record">
                                                    <article key={record.key} class="config-record">
                                                        <div class="config-record__header">
                                                            <div>
                                                                <div class="config-record__title">{record.label}</div>
                                                                <div class="config-record__subtitle">{record.subtitle}</div>
                                                            </div>
                                                            <div class="config-record__actions">
                                                                <div class={record.statusClass}>{record.status}</div>
                                                                <lightning-button-icon
                                                                    icon-name="utility:delete"
                                                                    alternative-text="Delete"
                                                                    title="Delete"
                                                                    variant="border-filled"
                                                                    data-section-key={section.key}
                                                                    data-metadata-full-name={record.metadataFullName}
                                                                    disabled={record.isDeactivateDisabled}
                                                                    onclick={handleDeactivateConfigRecordClick}>
                                                                </lightning-button-icon>
                                                            </div>
                                                        </div>
                                                        <dl class="config-fields">
                                                            <template for:each={record.fields} for:item="field">
                                                                <div key={field.key} class="config-field">
                                                                    <dt class="config-field__label">{field.label}</dt>
                                                                    <dd class="config-field__value">{field.value}</dd>
                                                                </div>
                                                            </template>
                                                        </dl>
                                                    </article>
                                                </template>
                                            </template>
                                            <template if:false={section.hasRecords}>
                                                <div class="empty" role="status">No configuration records.</div>
                                            </template>
                                        </section>
                                    </template>
                                </div>
                            </template>
                            <template if:false={hasConfiguration}>
                                <div class="empty" role="status">Open Build, Channels, or Advanced to load template configuration.</div>
                            </template>
                        </section>
                    </section>
                </template>
                </main>
            </div>
            </template>

            <template if:true={isCreatingTemplate}>
                <section class="modal-backdrop" role="presentation">
                    <div class="modal modal_large" role="dialog" aria-modal="true" aria-label="Create SmartIntake template">
                        <header class="modal__header">
                            <div>
                                <div class="console-kicker">New template</div>
                                <h2>Create SmartIntake Template</h2>
                            </div>
                            <button type="button" class="modal__close" aria-label="Close new template wizard" onclick={handleWizardClose}>x</button>
                        </header>

                        <div class="wizard-steps" aria-label="Template setup steps">
                            <div class={wizardStepOneClass}>1. Template</div>
                            <div class={wizardStepTwoClass}>2. Messages</div>
                            <div class={wizardStepThreeClass}>3. Review</div>
                        </div>

                        <section class="wizard-body" aria-label="Template creation wizard">
                            <template if:true={isSetupStepOne}>
                                <div class="form-grid">
                                    <lightning-input label="Template Name" value={setupDraft.templateName} data-field="templateName" onchange={handleSetupChange}></lightning-input>
                                    <lightning-input label="Template Key" value={setupDraft.templateKey} data-field="templateKey" onchange={handleSetupChange}></lightning-input>
                                    <lightning-input label="Start Question Key" value={setupDraft.startQuestionKey} data-field="startQuestionKey" onchange={handleSetupChange}></lightning-input>
                                </div>
                                <div class="form-grid form-grid_spaced">
                                    <lightning-input type="checkbox" label="Active" checked={setupDraft.isActive} data-field="isActive" onchange={handleSetupChange}></lightning-input>
                                    <lightning-input type="checkbox" label="Requires Consent" checked={setupDraft.requiresConsent} data-field="requiresConsent" onchange={handleSetupChange}></lightning-input>
                                    <lightning-input type="checkbox" label="Requires Final Confirmation" checked={setupDraft.requiresFinalConfirmation} data-field="requiresFinalConfirmation" onchange={handleSetupChange}></lightning-input>
                                </div>
                            </template>

                            <template if:true={isSetupStepTwo}>
                                <div class="form-grid">
                                    <lightning-textarea label="Consent Message" value={setupDraft.consentMessage} data-field="consentMessage" onchange={handleSetupChange}></lightning-textarea>
                                    <lightning-textarea label="Completion Message" value={setupDraft.completionMessage} data-field="completionMessage" onchange={handleSetupChange}></lightning-textarea>
                                </div>
                            </template>

                            <template if:true={isSetupStepThree}>
                                <template if:true={isSetupLoading}>
                                    <div class="centered">
                                        <lightning-spinner alternative-text="Previewing template metadata" size="small"></lightning-spinner>
                                    </div>
                                </template>
                                <template if:true={hasSetupPlan}>
                                    <section class="plan-card" aria-label="Template starter metadata plan">
                                        <div class={setupPlan.statusClass}>{setupPlan.statusLabel}</div>
                                        <div class="builder-plan__meta">
                                            <span>{setupPlan.recordCount} records</span>
                                            <span>{setupPlan.errorCount} errors</span>
                                            <span>{setupPlan.warningCount} warnings</span>
                                            <span>{setupPlan.metadataWriteStatus}</span>
                                        </div>
                                        <div class="builder-plan__notice">{setupPlan.metadataWriteNotice}</div>
                                        <template if:true={setupPlan.hasDeploymentStatus}>
                                            <div class="deployment-status" aria-label="Template deployment status">
                                                <div class="deployment-status__header">
                                                    <span>{setupPlan.deploymentStatus.statusLabel}</span>
                                                    <code>{setupPlan.deploymentStatus.deploymentJobId}</code>
                                                </div>
                                                <div class="deployment-status__bar" aria-label="Deployment progress">
                                                    <span style={setupPlan.deploymentStatus.progressStyle}></span>
                                                </div>
                                                <div class="deployment-status__meta">
                                                    <span>{setupPlan.deploymentStatus.componentProgressLabel}</span>
                                                    <span>{setupPlan.deploymentStatus.testProgressLabel}</span>
                                                </div>
                                            </div>
                                        </template>
                                        <template if:true={hasSetupIssues}>
                                            <div class="stack-list">
                                                <template for:each={setupPlan.issues} for:item="issue">
                                                    <article key={issue.key} class={issue.className}>
                                                        <div class="issue__header">
                                                            <span class="issue__severity">{issue.severity}</span>
                                                            <span class="issue__code">{issue.code}</span>
                                                        </div>
                                                        <div class="issue__message">{issue.message}</div>
                                                    </article>
                                                </template>
                                            </div>
                                        </template>
                                    </section>
                                </template>
                            </template>
                        </section>

                        <footer class="modal__footer">
                            <lightning-button label="Back" onclick={handleWizardBack} disabled={wizardBackDisabled}></lightning-button>
                            <template if:false={isSetupStepThree}>
                                <lightning-button label={wizardNextLabel} variant="brand" onclick={handleWizardNext} disabled={isSetupLoading}></lightning-button>
                            </template>
                            <template if:true={isSetupStepThree}>
                                <lightning-button label="Refresh Preview" onclick={handlePreviewTemplateDraft} disabled={isSetupLoading}></lightning-button>
                                <lightning-button label="Deploy Template" variant="brand" onclick={handleWizardFinish} disabled={isSetupDeployButtonDisabled}></lightning-button>
                            </template>
                        </footer>
                    </div>
                </section>
            </template>

            <template if:true={hasConfirmModal}>
                <section class="modal-backdrop" role="presentation">
                    <div class="modal" role="dialog" aria-modal="true" aria-label={confirmModal.title}>
                        <header class="modal__header">
                            <h2>{confirmModal.title}</h2>
                            <button type="button" class="modal__close" aria-label="Cancel confirmation" onclick={handleModalCancel}>x</button>
                        </header>
                        <div class="modal__body">
                            <p>{confirmModal.body}</p>
                        </div>
                        <footer class="modal__footer">
                            <lightning-button label="Cancel" onclick={handleModalCancel}></lightning-button>
                            <lightning-button label={confirmModal.confirmLabel} variant="brand" onclick={handleModalConfirm}></lightning-button>
                        </footer>
                    </div>
                </section>
            </template>
    </div>
</template>
