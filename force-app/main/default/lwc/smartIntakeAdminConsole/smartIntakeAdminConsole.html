<template>
    <div class="admin admin_v2">
        <section class="slds-page-header console-header" aria-label="SmartIntake admin header">
            <div class="slds-page-header__row">
                <div class="slds-page-header__col-title">
                    <div class="slds-media">
                        <div class="slds-media__figure">
                            <span class="slds-icon_container slds-icon-standard-flow console-header__icon" title="SmartIntake">
                                <lightning-icon icon-name="standard:flow" size="small" alternative-text="SmartIntake"></lightning-icon>
                            </span>
                        </div>
                        <div class="slds-media__body">
                            <div class="console-kicker">Metadata-driven intake builder</div>
                            <h1 class="slds-page-header__title slds-truncate" title="SmartIntake Admin">SmartIntake Admin</h1>
                            <p class="console-title__description">Build template questions, rules, routing, and deployment checks in one SLDS workspace.</p>
                        </div>
                    </div>
                </div>
                <div class="slds-page-header__col-actions">
                    <div class="toolbar">
                        <lightning-combobox
                            class="template-selector"
                            label="Template"
                            value={selectedTemplateKey}
                            options={templateOptions}
                            onchange={handleTemplateChange}>
                        </lightning-combobox>
                        <lightning-button
                            label="New Template"
                            icon-name="utility:add"
                            onclick={handleNewTemplate}>
                        </lightning-button>
                        <lightning-button
                            label="Refresh"
                            icon-name="utility:refresh"
                            variant="brand"
                            onclick={handleValidate}
                            disabled={isLoading}>
                        </lightning-button>
                    </div>
                </div>
            </div>
        </section>

        <template if:true={isLoading}>
            <div class="centered">
                <lightning-spinner alternative-text="Loading SmartIntake admin console" size="small"></lightning-spinner>
            </div>
        </template>

        <template if:true={hasToast}>
            <div class={toastClass} role="status">
                <lightning-icon icon-name={toastIconName} size="x-small" alternative-text={toastMessage.type}></lightning-icon>
                <span>{toastMessage.text}</span>
                <button type="button" class="toast__close" aria-label="Dismiss message" onclick={handleToastDismiss}>x</button>
            </div>
        </template>

        <template if:true={showTemplateEmptyState}>
            <section class="empty-state" aria-label="No templates">
                <div class="empty-state__icon">
                    <lightning-icon icon-name="utility:template" size="small" alternative-text="Template"></lightning-icon>
                </div>
                <h2>No SmartIntake templates yet</h2>
                <p>Create the first template metadata set, then add questions and channel rules.</p>
                <lightning-button
                    label="Create first template"
                    icon-name="utility:add"
                    variant="brand"
                    onclick={handleNewTemplate}>
                </lightning-button>
            </section>
        </template>

        <template if:true={showTemplateWorkspace}>
            <section class="template-status slds-box" aria-label="Template status">
                <div class="template-status__identity">
                    <div class="status-heading">{selectedTemplateName}</div>
                    <div class="status-subtitle">{selectedTemplateKey}</div>
                </div>
                <div class="template-status__actions">
                    <div class={statusClass}>
                        <lightning-icon icon-name={statusIcon} size="x-small" alternative-text={statusLabel}></lightning-icon>
                        <span>{statusLabel}</span>
                    </div>
                    <lightning-button
                        label="Build Questions"
                        icon-name="utility:edit"
                        data-tab="build"
                        onclick={handleAdminSectionClick}>
                    </lightning-button>
                    <lightning-button
                        label="Review Readiness"
                        icon-name="utility:check"
                        data-tab="test"
                        onclick={handleAdminSectionClick}>
                    </lightning-button>
                </div>
            </section>

            <div class="workspace-shell">
                <aside class="setup-nav-panel" aria-label="SmartIntake builder navigation">
                    <div class="setup-nav-panel__heading">
                        <span class="setup-nav-panel__eyebrow">Builder</span>
                        <strong>{workspaceTitle}</strong>
                    </div>
                    <nav class="slds-nav-vertical" role="tablist" aria-label="SmartIntake admin sections">
                        <div class="slds-nav-vertical__section">
                            <ul>
                                <template for:each={adminTabItems} for:item="item">
                                    <li key={item.value} class={item.navItemClass}>
                                        <button
                                            type="button"
                                            role="tab"
                                            class={item.buttonClass}
                                            data-tab={item.value}
                                            data-testid={item.testId}
                                            aria-selected={item.selected}
                                            onclick={handleAdminSectionClick}>
                                            <span class="setup-nav__icon">
                                                <lightning-icon icon-name={item.iconName} size="x-small" alternative-text={item.label}></lightning-icon>
                                            </span>
                                            <span class="setup-nav__body">
                                                <span class="setup-nav__label">{item.label}</span>
                                                <span class="setup-nav__description">{item.description}</span>
                                            </span>
                                            <template if:true={item.showBadge}>
                                                <span class={item.badgeClass}>{item.badgeCount}</span>
                                            </template>
                                        </button>
                                    </li>
                                </template>
                            </ul>
                        </div>
                    </nav>
                </aside>

                <main class="workspace-main">
                    <section class="workspace-stage" aria-label="Current workspace stage">
                        <div>
                            <div class="console-kicker">Current stage</div>
                            <h2>{workspaceTitle}</h2>
                            <p>{workspaceDescription}</p>
                        </div>
                        <div class="workspace-stage__metrics">
                            <span><strong>{healthScore}%</strong> health</span>
                            <span><strong>{readinessBlockedCount}</strong> blocked</span>
                            <span><strong>{readinessWarningCount}</strong> warnings</span>
                        </div>
                    </section>

                <template if:true={isOverviewTab}>
                    <section class="workspace" aria-label="Overview">
                        <div class="summary-grid">
                            <template for:each={summaryItems} for:item="item">
                                <div key={item.key} class="metric">
                                    <span class="metric__value">{item.value}</span>
                                    <span class="metric__label">{item.label}</span>
                                </div>
                            </template>
                        </div>

                        <div class="two-column">
                            <section class="panel-block" aria-label="Template readiness">
                                <div class="section-heading">
                                    <div>
                                        <h2>Readiness</h2>
                                        <p>Checks that must pass before the template should run in chat.</p>
                                    </div>
                                    <template if:true={readiness}>
                                        <span class="badge">{readiness.overallStatus}</span>
                                    </template>
                                </div>

                                <template if:true={hasReadinessItems}>
                                    <div class="stack-list">
                                        <template for:each={readinessItems} for:item="item">
                                            <article key={item.key} class={item.className}>
                                                <div class="readiness-item__header">
                                                    <span>{item.label}</span>
                                                    <span class="readiness-item__status">{item.status}</span>
                                                </div>
                                                <div class="readiness-item__message">{item.message}</div>
                                            </article>
                                        </template>
                                    </div>
                                </template>
                                <template if:false={hasReadinessItems}>
                                    <div class="empty" role="status">No readiness checks loaded.</div>
                                </template>
                            </section>

                            <section class="panel-block" aria-label="Validation issues">
                                <div class="section-heading">
                                    <div>
                                        <h2>Issues</h2>
                                        <p>Metadata errors and warnings for the selected template.</p>
                                    </div>
                                    <span class="badge">{validation.errorCount} errors</span>
                                </div>

                                <template if:true={hasIssues}>
                                    <div class="stack-list">
                                        <template for:each={validation.issues} for:item="issue">
                                            <article key={issue.key} class={issue.className}>
                                                <div class="issue__header">
                                                    <span class="issue__severity">{issue.severity}</span>
                                                    <span class="issue__code">{issue.code}</span>
                                                </div>
                                                <div class="issue__target">{issue.componentType}: {issue.componentKey}</div>
                                                <div class="issue__message">{issue.message}</div>
                                            </article>
                                        </template>
                                    </div>
                                </template>
                                <template if:false={hasIssues}>
                                    <div class="empty" role="status">No validation issues.</div>
                                </template>
                            </section>
                        </div>
                    </section>
                </template>

                <template if:true={isBuildTab}>
                    <section class="workspace" aria-label="Build">
                        <template if:true={isConfigurationLoading}>
                            <div class="centered">
                                <lightning-spinner alternative-text="Loading template configuration" size="small"></lightning-spinner>
                            </div>
                        </template>

                        <div class="studio-layout">
                            <aside class="question-sidebar" aria-label="Existing questions">
                                <div class="section-heading section-heading_compact">
                                    <div>
                                        <h2>Questions</h2>
                                        <p>Select a question or create one.</p>
                                    </div>
                                    <lightning-button
                                        label="New"
                                        icon-name="utility:add"
                                        onclick={handleNewQuestionDraft}>
                                    </lightning-button>
                                </div>

                                <template if:true={hasQuestionRecords}>
                                    <div class="question-list__items">
                                        <template for:each={questionItems} for:item="question">
                                            <button
                                                key={question.key}
                                                type="button"
                                                class={question.listClass}
                                                data-question-key={question.questionKey}
                                                onclick={handleEditQuestion}>
                                                <span class="question-select__number">{question.listNumber}</span>
                                                <span class="question-select__body">
                                                    <span class="question-select__title">{question.displayText}</span>
                                                    <span class="question-select__meta">{question.questionKey} | {question.displayInputType} | {question.displayUiControl}</span>
                                                </span>
                                            </button>
                                        </template>
                                    </div>
                                </template>
                                <template if:false={hasQuestionRecords}>
                                    <div class="empty">No questions exist for this template yet.</div>
                                </template>
                            </aside>

                            <section class="question-workspace" aria-label="Question builder" data-testid="question-builder-section">
                                <div class="section-heading">
                                    <div>
                                        <h2>{builderModeLabel}</h2>
                                        <p>Everything needed for one question lives here: prompt, renderer, options, files, validation, and actions.</p>
                                    </div>
                                </div>

                                <section class="accordion-section" aria-label="Question metadata builder">
                                    <button type="button" class="accordion-section__header" data-section="question" aria-expanded={isQuestionAccordionOpen} onclick={handleAccordionToggle}>
                                        <span>Question</span>
                                        <lightning-icon icon-name={questionAccordionIcon} size="xx-small" alternative-text="Toggle question"></lightning-icon>
                                    </button>
                                    <div class={questionAccordionBodyClass}>
                                        <div class="form-grid">
                                            <lightning-input
                                                label="Question Key"
                                                value={builderDraft.questionKey}
                                                data-field="questionKey"
                                                data-testid="builder-question-key"
                                                onchange={handleBuilderChange}>
                                            </lightning-input>
                                            <lightning-input
                                                type="number"
                                                label="Order"
                                                value={builderDraft.questionOrder}
                                                data-field="questionOrder"
                                                data-testid="builder-question-order"
                                                onchange={handleBuilderChange}>
                                            </lightning-input>
                                            <lightning-input
                                                type="checkbox"
                                                label="Required"
                                                checked={builderDraft.isRequired}
                                                data-field="isRequired"
                                                data-testid="builder-required"
                                                onchange={handleBuilderChange}>
                                            </lightning-input>
                                            <lightning-input
                                                type="checkbox"
                                                label="Confirm AI extracted answer"
                                                checked={builderDraft.confirmAiExtractedAnswer}
                                                data-field="confirmAiExtractedAnswer"
                                                onchange={handleBuilderChange}>
                                            </lightning-input>
                                        </div>
                                        <lightning-input
                                            label="Question Text"
                                            value={builderDraft.questionText}
                                            data-field="questionText"
                                            data-testid="builder-question-text"
                                            onchange={handleBuilderChange}>
                                        </lightning-input>
                                        <div class="form-grid form-grid_spaced">
                                            <lightning-input
                                                label="Help Text"
                                                value={builderDraft.helpText}
                                                data-field="helpText"
                                                data-testid="builder-help-text"
                                                onchange={handleBuilderChange}>
                                            </lightning-input>
                                            <lightning-input
                                                label="Placeholder Text"
                                                value={builderDraft.placeholderText}
                                                data-field="placeholderText"
                                                data-testid="builder-placeholder-text"
                                                onchange={handleBuilderChange}>
                                            </lightning-input>
                                        </div>
                                    </div>
                                </section>

                                <section class="accordion-section">
                                    <button type="button" class="accordion-section__header" data-section="control" aria-expanded={isControlAccordionOpen} onclick={handleAccordionToggle}>
                                        <span>Input Control</span>
                                        <lightning-icon icon-name={controlAccordionIcon} size="xx-small" alternative-text="Toggle input control"></lightning-icon>
                                    </button>
                                    <div class={controlAccordionBodyClass}>
                                        <div class="form-grid">
                                            <lightning-combobox
                                                label="Question Type"
                                                value={builderQuestionType}
                                                options={questionTypeOptions}
                                                data-field="questionType"
                                                data-testid="builder-input-type"
                                                onchange={handleBuilderChange}>
                                            </lightning-combobox>
                                            <template if:true={isCustomRendererQuestion}>
                                                <lightning-input
                                                    label="Custom LWC Component"
                                                    value={builderDraft.uiControl}
                                                    placeholder="c/smartIntakeProductSelector"
                                                    field-level-help="Enter the LWC module name directly, for example c/smartIntakeProductSelector. Deploy the question, then sync the custom control registry so LWR can load the component safely."
                                                    data-field="uiControl"
                                                    data-testid="builder-ui-control"
                                                    onchange={handleBuilderChange}>
                                                </lightning-input>
                                                <lightning-combobox
                                                    label="Stored Answer Type"
                                                    value={storedAnswerTypeValue}
                                                    options={storedAnswerTypeOptions}
                                                    data-field="storedAnswerType"
                                                    onchange={handleBuilderChange}>
                                                </lightning-combobox>
                                                <lightning-input
                                                    label="Data Source Key"
                                                    value={builderDraft.dataSourceKey}
                                                    data-field="dataSourceKey"
                                                    onchange={handleBuilderChange}>
                                                </lightning-input>
                                                <div class="custom-renderer-registry">
                                                    <p>After the question metadata is deployed, preview and sync the registry so active questions with c/... UI controls render in fresh chat sessions.</p>
                                                    <div class="actions actions_compact">
                                                        <lightning-button label="Preview Registry" icon-name="utility:preview" onclick={handlePreviewCustomControlRegistry} disabled={isRegistryLoading}></lightning-button>
                                                        <lightning-button label="Sync Registry" icon-name="utility:sync" variant="brand" onclick={handleDeploySyncClick} disabled={isRegistrySyncButtonDisabled}></lightning-button>
                                                    </div>
                                                </div>
                                            </template>
                                            <lightning-input
                                                type="checkbox"
                                                label="Render Lightning Input"
                                                field-level-help="Show an inline Lightning input or custom control inside the agent message. Leave unchecked for plain text answers that should use the normal chat message box."
                                                checked={builderDraft.renderLightningInput}
                                                data-field="renderLightningInput"
                                                onchange={handleBuilderChange}>
                                            </lightning-input>
                                        </div>
                                        <div class="control-summary">
                                            <div>
                                                <span class="control-summary__label">Renderer</span>
                                                <strong>{selectedControlTitle}</strong>
                                                <span>{selectedControlComponent}</span>
                                            </div>
                                            <p>{selectedControlNotes}</p>
                                            <p class="control-summary__registry-note">Direct c/... LWC components load automatically when Render Lightning Input is enabled.</p>
                                        </div>
                                        <template if:true={isOptionInputType}>
                                            <section class="rule-card" aria-label="Answer options">
                                                <h3>Answer options</h3>
                                                <lightning-textarea
                                                    label="Options"
                                                    value={builderDraft.optionLines}
                                                    data-field="optionLines"
                                                    onchange={handleBuilderChange}>
                                                </lightning-textarea>
                                            </section>
                                        </template>
                                        <template if:true={isFileInputType}>
                                            <section class="rule-card" aria-label="File settings">
                                                <h3>File settings</h3>
                                                <div class="form-grid form-grid_spaced">
                                                    <lightning-input
                                                        label="Accepted File Types"
                                                        value={builderDraft.acceptedFileTypes}
                                                        data-field="acceptedFileTypes"
                                                        onchange={handleBuilderChange}>
                                                    </lightning-input>
                                                    <lightning-input
                                                        type="number"
                                                        label="Max File Count"
                                                        value={builderDraft.maxFileCount}
                                                        data-field="maxFileCount"
                                                        onchange={handleBuilderChange}>
                                                    </lightning-input>
                                                    <lightning-input
                                                        type="checkbox"
                                                        label="Allow Multiple Files"
                                                        checked={builderDraft.allowMultipleFiles}
                                                        data-field="allowMultipleFiles"
                                                        onchange={handleBuilderChange}>
                                                    </lightning-input>
                                                </div>
                                            </section>
                                        </template>
                                    </div>
                                </section>

                                <section class="accordion-section" aria-label="Admin configuration builder">
                                    <button type="button" class="accordion-section__header" data-section="validation" aria-expanded={isValidationAccordionOpen} onclick={handleAccordionToggle}>
                                        <span>Validation Rules For This Question</span>
                                        <lightning-icon icon-name={validationAccordionIcon} size="xx-small" alternative-text="Toggle validation rules"></lightning-icon>
                                    </button>
                                    <div class={validationAccordionBodyClass}>
                                        <section class="configured-rules" aria-label="Configured validation rules">
                                            <div class="configured-rules__header">
                                                <div>
                                                    <h3>Validation rules</h3>
                                                    <p>Rules that validate the selected question answer before continuing.</p>
                                                </div>
                                                <div class="configured-rules__header-actions">
                                                    <button
                                                        type="button"
                                                        class="compact-action-button"
                                                        title={questionConfigDraftButtonTitle}
                                                        disabled={isQuestionConfigDraftButtonDisabled}
                                                        onclick={handleNewValidationConfigDraft}>
                                                        <lightning-icon icon-name="utility:add" size="xx-small" alternative-text=""></lightning-icon>
                                                        <span>Add rule</span>
                                                    </button>
                                                    <template if:true={hasValidationConfigDraftVisible}>
                                                        <button type="button" class="compact-icon-button compact-icon-button_destructive" aria-label="Remove validation rule draft" title="Remove draft" onclick={handleRemoveValidationConfigDraft}>
                                                            <lightning-icon icon-name="utility:close" size="xx-small" alternative-text=""></lightning-icon>
                                                        </button>
                                                    </template>
                                                </div>
                                            </div>

                                            <template if:true={hasSelectedQuestionValidationConfigRecords}>
                                                <div class="configured-rule-list">
                                                    <template for:each={selectedQuestionValidationConfigRecords} for:item="rule">
                                                        <article key={rule.key} class="configured-rule">
                                                            <div class="configured-rule__content">
                                                                <span class={rule.typeClass}>{rule.typeLabel}</span>
                                                                <strong>{rule.title}</strong>
                                                                <span>{rule.detail}</span>
                                                                <span class="configured-rule__meta">{rule.configKey} | {rule.meta}</span>
                                                            </div>
                                                            <div class="configured-rule__actions">
                                                                <lightning-button label="Edit" data-config-type={rule.configType} data-config-key={rule.configKey} onclick={handleLoadQuestionConfig}></lightning-button>
                                                                <lightning-button label="Delete" variant="destructive-text" data-config-type={rule.configType} data-config-key={rule.configKey} disabled={rule.isDeactivateDisabled} onclick={handleDeactivateQuestionConfigClick}></lightning-button>
                                                            </div>
                                                        </article>
                                                    </template>
                                                </div>
                                            </template>
                                            <template if:false={hasSelectedQuestionValidationConfigRecords}>
                                                <div class="empty">No validation rules are configured for this question yet.</div>
                                            </template>
                                        </section>

                                        <template if:true={isValidationConfigDraftVisible}>
                                            <div class="form-grid">
                                                <lightning-input label="Config Key" value={configDraft.configKey} data-field="configKey" onchange={handleConfigChange}></lightning-input>
                                                <lightning-input label="Label" value={configDraft.label} data-field="label" onchange={handleConfigChange}></lightning-input>
                                                <lightning-input label="Question Key" value={activeConfigQuestionKey} data-field="questionKey" onchange={handleConfigChange}></lightning-input>
                                                <lightning-input type="checkbox" label="Active" checked={configDraft.isActive} data-field="isActive" onchange={handleConfigChange}></lightning-input>
                                            </div>

                                            <section class="rule-card" aria-label="Validation rule fields">
                                                <h3>Validation rule</h3>
                                                <div class="form-grid form-grid_spaced">
                                                    <lightning-combobox label="Validation Type" value={configDraft.validationType} options={validationTypeOptions} data-field="validationType" onchange={handleConfigChange}></lightning-combobox>
                                                    <template if:true={showValidationRegexField}>
                                                        <lightning-input label="Regex" value={configDraft.regex} data-field="regex" onchange={handleConfigChange}></lightning-input>
                                                    </template>
                                                    <template if:true={showValidationMinLengthField}>
                                                        <lightning-input type="number" label="Min Length" value={configDraft.minLength} data-field="minLength" onchange={handleConfigChange}></lightning-input>
                                                    </template>
                                                    <template if:true={showValidationMaxLengthField}>
                                                        <lightning-input type="number" label="Max Length" value={configDraft.maxLength} data-field="maxLength" onchange={handleConfigChange}></lightning-input>
                                                    </template>
                                                    <template if:true={showValidationMinValueField}>
                                                        <lightning-input type="number" label="Min Value" value={configDraft.minValue} data-field="minValue" onchange={handleConfigChange}></lightning-input>
                                                    </template>
                                                    <template if:true={showValidationMaxValueField}>
                                                        <lightning-input type="number" label="Max Value" value={configDraft.maxValue} data-field="maxValue" onchange={handleConfigChange}></lightning-input>
                                                    </template>
                                                    <template if:true={showValidationMinDateField}>
                                                        <lightning-input type="date" label="Min Date" value={configDraft.minDate} data-field="minDate" onchange={handleConfigChange}></lightning-input>
                                                    </template>
                                                    <template if:true={showValidationMaxDateField}>
                                                        <lightning-input type="date" label="Max Date" value={configDraft.maxDate} data-field="maxDate" onchange={handleConfigChange}></lightning-input>
                                                    </template>
                                                    <lightning-input label="Error Message" value={configDraft.errorMessage} data-field="errorMessage" onchange={handleConfigChange}></lightning-input>
                                                </div>
                                            </section>

                                            <div class="actions">
                                                <lightning-button label="Preview Validation Rule" icon-name="utility:preview" onclick={handlePreviewAdminConfigDraft} disabled={isConfigLoading}></lightning-button>
                                                <lightning-button label="Deploy Validation Rule" icon-name="utility:upload" variant="brand" onclick={handleDeployConfigClick} disabled={isConfigDeployButtonDisabled}></lightning-button>
                                            </div>
                                        </template>
                                    </div>
                                </section>

                                <section class="accordion-section" aria-label="Admin configuration builder">
                                    <button type="button" class="accordion-section__header" data-section="actions" aria-expanded={isActionsAccordionOpen} onclick={handleAccordionToggle}>
                                        <span>Actions</span>
                                        <lightning-icon icon-name={actionsAccordionIcon} size="xx-small" alternative-text="Toggle actions"></lightning-icon>
                                    </button>
                                    <div class={actionsAccordionBodyClass}>
                                        <section class="configured-rules" aria-label="Configured actions">
                                            <div class="configured-rules__header">
                                                <div>
                                                    <h3>Actions for this question</h3>
                                                    <p>Visibility, routing, blocking, and Flow hook actions attached to the selected question.</p>
                                                </div>
                                                <div class="configured-rules__header-actions">
                                                    <button
                                                        type="button"
                                                        class="compact-action-button"
                                                        title={questionConfigDraftButtonTitle}
                                                        disabled={isQuestionConfigDraftButtonDisabled}
                                                        onclick={handleNewActionConfigDraft}>
                                                        <lightning-icon icon-name="utility:add" size="xx-small" alternative-text=""></lightning-icon>
                                                        <span>Add action</span>
                                                    </button>
                                                    <template if:true={hasActionConfigDraftVisible}>
                                                        <button type="button" class="compact-icon-button compact-icon-button_destructive" aria-label="Remove action draft" title="Remove draft" onclick={handleRemoveActionConfigDraft}>
                                                            <lightning-icon icon-name="utility:close" size="xx-small" alternative-text=""></lightning-icon>
                                                        </button>
                                                    </template>
                                                </div>
                                            </div>

                                            <template if:true={hasSelectedQuestionActionConfigRecords}>
                                                <div class="configured-rule-list">
                                                    <template for:each={selectedQuestionActionConfigRecords} for:item="rule">
                                                        <article key={rule.key} class="configured-rule">
                                                            <div class="configured-rule__content">
                                                                <span class={rule.typeClass}>{rule.typeLabel}</span>
                                                                <strong>{rule.title}</strong>
                                                                <span>{rule.detail}</span>
                                                                <span class="configured-rule__meta">{rule.configKey} | {rule.meta}</span>

                                                <lightning-input label="Question Key" value={activeConfigQuestionKey} data-field="questionKey" onchange={handleConfigChange}></lightning-input>

                                            <template if:true={isConditionConfig}>

                                                        <lightning-combobox label="Operator" value={configDraft.operator} options={conditionOperatorOptionsForSource} data-field="operator" onchange={handleConfigChange}></lightning-combobox>

                                                        <lightning-input label="Condition Group Key" value={configDraft.conditionGroupKey} data-field="conditionGroupKey" onchange={handleConfigChange}></lightning-input>

                                                    </template>
                                                    <template if:true={isBlockCondition}>
                                                        <lightning-input label="User Message" value={configDraft.userMessage} placeholder="Tell the user why this answer cannot continue" data-field="userMessage" onchange={handleConfigChange}></lightning-input>
                                                    </template>
                                                </section>
                                            </template>

                                            <template if:true={isHookConfig}>
                                                <section class="rule-card" aria-label="Flow hook fields">

                                                        <lightning-combobox label="Handler" value={configDraft.handlerType} options={hookHandlerTypeOptions} data-field="handlerType" onchange={handleConfigChange}></lightning-combobox>

                                                        <lightning-combobox label="Output Mode" value={configDraft.outputMode} options={hookOutputModeOptions} data-field="outputMode" onchange={handleConfigChange}></lightning-combobox>

                                                        <lightning-input label="User Message Output Variable" value={configDraft.userMessageOutputVariable} data-field="userMessageOutputVariable" onchange={handleConfigChange}></lightning-input>
                                                        <lightning-input label="Next Question Output Variable" value={configDraft.nextQuestionOutputVariable} data-field="nextQuestionOutputVariable" onchange={handleConfigChange}></lightning-input>

                                                                        <div class="flow-variable-row__meta">
                                                                            <strong>{variable.apiName}</strong>
                                                                            <span>{variable.typeDetail}</span>
                                                                        </div>
                                                                        <lightning-combobox label="Value Source" value={variable.sourceKey} options={flowInputSourceOptions} data-variable-name={variable.apiName} onchange={handleFlowInputMappingChange}></lightning-combobox>
                                                                    </div>
                                                                </template>
                                                            </div>
                                                        </section>
                                                    </template>
                                                    <template if:false={hasSelectedFlowInputVariables}>
                                                        <lightning-textarea label="Flow Input Mappings" value={configDraft.flowInputMappings} data-field="flowInputMappings" onchange={handleConfigChange}></lightning-textarea>
                                                    </template>

                                                    <template if:true={isBasicHookOutputMode}>
                                                        <template if:true={hasSelectedFlowOutputVariables}>
                                                            <section class="flow-variable-panel" aria-label="Flow output variable mappings">
                                                                <h4>Flow Output Variables</h4>
                                                                <div class="flow-variable-list">
                                                                    <template for:each={flowOutputMappingRows} for:item="variable">
                                                                        <div key={variable.key} class="flow-variable-row">
                                                                            <div class="flow-variable-row__meta">
                                                                                <strong>{variable.apiName}</strong>
                                                                                <span>{variable.typeDetail}</span>
                                                                            </div>
                                                                            <div class="flow-variable-row__control">
                                                                                <lightning-input
                                                                                    label="Store As"
                                                                                    value={variable.answerKey}
                                                                                    placeholder={variable.storeAsPlaceholder}

                                                                                    data-variable-name={variable.apiName}
                                                                                    onchange={handleFlowOutputMappingChange}>
                                                                                </lightning-input>
                                                                                <span>{variable.outputMappingHelpText}</span>

                                                                        </div>
                                                                    </template>
                                                                </div>
                                                            </section>
                                                        </template>
                                                        <template if:false={hasSelectedFlowOutputVariables}>
                                                            <lightning-textarea label="Flow Output Mappings" value={configDraft.flowOutputMappings} data-field="flowOutputMappings" onchange={handleConfigChange}></lightning-textarea>
                                                        </template>
                                                    </template>
                                                </section>
                                            </template>

                                            <div class="actions">
                                                <lightning-button label="Preview Action" icon-name="utility:preview" onclick={handlePreviewAdminConfigDraft} disabled={isConfigLoading}></lightning-button>
                                                <lightning-button label="Deploy Action" icon-name="utility:upload" variant="brand" onclick={handleDeployConfigClick} disabled={isConfigDeployButtonDisabled}></lightning-button>
                                            </div>
                                        </template>
                                    </div>
                                </section>

                                <div class="actions action-bar">
                                    <lightning-button
                                        label="Preview Question Metadata"

                                        onclick={handlePreviewQuestionDraft}

                                    </lightning-button>
                                    <lightning-button
                                        label="Deploy Question"
                                        icon-name="utility:upload"
                                        variant="brand"
                                        data-testid="builder-deploy-metadata"
                                        onclick={handleDeployQuestionClick}

                                    </lightning-button>
                                </div>

                            <aside class="preview-panel" aria-label="Question preview">

                                    </div>
                                </div>

                                    <div class="chat-preview__bubble">Here's the next question.</div>
                                    <div class="chat-preview__card">
                                        <h3>{previewQuestionText}</h3>
                                        <p>{previewHelpText}</p>
                                        <div class="chat-preview__control">
                                            <span>{previewUiControl}</span>
                                            <strong>{previewInputType}</strong>
                                        </div>
                                        <div class="chat-preview__answer">{previewPlaceholderText}</div>
                                    </div>
                                    <div class="chat-preview__meta">{previewRequiredLabel}</div>
                                </div>

                                <template if:true={hasBuilderPlan}>
                                    <section class="plan-card" aria-label="Question metadata plan">
                                        <div class={builderPlan.statusClass}>{builderPlan.statusLabel}</div>
                                        <div class="builder-plan__meta">
                                            <span>{builderPlan.recordCount} records</span>
                                            <span>{builderPlan.errorCount} errors</span>
                                            <span>{builderPlan.warningCount} warnings</span>
                                            <span>{builderPlan.metadataWriteStatus}</span>
                                        </div>
                                        <div class="builder-plan__notice">{builderPlan.metadataWriteNotice}</div>

                                            <div class="deployment-status" aria-label="Question deployment status">
                                                <div class="deployment-status__header">
                                                    <span>{builderPlan.deploymentStatus.statusLabel}</span>
                                                    <code>{builderPlan.deploymentStatus.deploymentJobId}</code>
                                                </div>
                                                <div class="deployment-status__bar" aria-label="Deployment progress">
                                                    <span style={builderPlan.deploymentStatus.progressStyle}></span>
                                                </div>
                                                <div class="deployment-status__meta">
                                                    <span>{builderPlan.deploymentStatus.componentProgressLabel}</span>
                                                    <span>{builderPlan.deploymentStatus.testProgressLabel}</span>
                                                </div>
                                            </div>
                                        </template>
                                    </section>
                                </template>

                                <template if:true={hasConfigPlan}>
                                    <section class="plan-card" aria-label="Rule metadata plan">
                                        <div class={configPlan.statusClass}>{configPlan.statusLabel}</div>
                                        <div class="builder-plan__meta">
                                            <span>{configPlan.recordCount} records</span>
                                            <span>{configPlan.errorCount} errors</span>
                                            <span>{configPlan.warningCount} warnings</span>
                                            <span>{configPlan.metadataWriteStatus}</span>
                                        </div>
                                        <div class="builder-plan__notice">{configPlan.metadataWriteNotice}</div>

                                            <div class="issues-list builder-plan__issues" role="status">

                                                    <article key={issue.key} class={issue.className}>
                                                        <div class="issue__header">
                                                            <span class="issue__severity">{issue.severity}</span>
                                                            <span class="issue__code">{issue.code}</span>
                                                        </div>
                                                        <div class="issue__target">{issue.componentType}: {issue.componentKey}</div>
                                                        <div class="issue__message">{issue.message}</div>
                                                    </article>
                                                </template>
                                            </div>
                                        </template>
                                        <template if:true={configPlan.hasDeploymentStatus}>
                                            <div class="deployment-status" aria-label="Rule deployment status">
                                                <div class="deployment-status__header">
                                                    <span>{configPlan.deploymentStatus.statusLabel}</span>
                                                    <code>{configPlan.deploymentStatus.deploymentJobId}</code>
                                                </div>
                                                <div class="deployment-status__bar" aria-label="Deployment progress">
                                                    <span style={configPlan.deploymentStatus.progressStyle}></span>
                                                </div>
                                                <div class="deployment-status__meta">
                                                    <span>{configPlan.deploymentStatus.componentProgressLabel}</span>
                                                    <span>{configPlan.deploymentStatus.testProgressLabel}</span>
                                                </div>
                                            </div>
                                        </template>
                                    </section>
                                </template>
                            </aside>
                        </div>

                        <section class="template-final-save panel-block" aria-label="Final Save Mappings">
                            <div class="configured-rules__header">
                                <div>
                                    <h2>Final Save Mappings</h2>
                                    <p>Map collected question answers and Flow output keys to the record created after confirmation.</p>
                                </div>
                                <div class="configured-rules__header-actions">
                                    <button type="button" class="compact-action-button" onclick={handleNewFinalSaveMappingDraft}>
                                        <lightning-icon icon-name="utility:add" size="xx-small" alternative-text=""></lightning-icon>
                                        <span>Add mapping</span>
                                    </button>
                                    <template if:true={hasFinalSaveMappingDraftVisible}>
                                        <button type="button" class="compact-icon-button compact-icon-button_destructive" aria-label="Remove final save mapping draft" title="Remove draft" onclick={handleRemoveFinalSaveMappingDraft}>
                                            <lightning-icon icon-name="utility:close" size="xx-small" alternative-text=""></lightning-icon>
                                        </button>
                                    </template>
                                </div>
                            </div>

                            <template if:true={hasFinalSaveMappingRecords}>
                                <div class="configured-rule-list final-save-list">
                                    <template for:each={finalSaveMappingRecords} for:item="mapping">
                                        <article key={mapping.key} class="configured-rule">
                                            <div class="configured-rule__content">
                                                <span class="configured-rule__type configured-rule__type_hook">{mapping.sourceType}</span>
                                                <strong>{mapping.title}</strong>
                                            </div>
                                            <div class="configured-rule__actions">
                                                <lightning-button-icon icon-name="utility:edit" alternative-text="Edit mapping" title="Edit mapping" data-config-key={mapping.configKey} onclick={handleLoadFinalSaveMapping}></lightning-button-icon>
                                                <lightning-button-icon icon-name="utility:delete" alternative-text="Delete mapping" title="Delete mapping" variant="border-filled" data-config-key={mapping.configKey} disabled={mapping.isDeactivateDisabled} onclick={handleDeactivateFinalSaveMappingClick}></lightning-button-icon>

                                        </article>
                                    </template>

                                        <lightning-combobox label="Target Field" value={configDraft.fieldApiName} options={finalSaveTargetFieldOptions} data-field="fieldApiName" disabled={isFinalSaveTargetFieldDisabled} onchange={handleConfigChange}></lightning-combobox>
                                    </div>

                                        <lightning-button label="Preview" icon-name="utility:preview" onclick={handlePreviewAdminConfigDraft} disabled={isConfigLoading}></lightning-button>
                                        <lightning-button label="Deploy" icon-name="utility:upload" variant="brand" onclick={handleDeployConfigClick} disabled={isConfigDeployButtonDisabled}></lightning-button>
                                    </div>
                                </section>
                            </template>
                        </section>
                    </section>
                </template>

                <template if:true={isChannelsTab}>
                    <section class="workspace" aria-label="Channels">

                                <lightning-spinner alternative-text="Loading channel configuration" size="small"></lightning-spinner>
                            </div>

                        <div class="channels-layout">

                                                                <strong>{record.label}</strong>
                                                                <span>{record.subtitle}</span>
                                                            </div>

                                                                <span class={record.statusClass}>{record.status}</span>

                                                                    alternative-text="Delete"
                                                                    title="Delete"
                                                                    variant="border-filled"
                                                                    data-section-key={section.key}
                                                                    data-metadata-full-name={record.metadataFullName}

                                            <lightning-input label="Filter Field API Name" value={configDraft.filterFieldApiName} data-field="filterFieldApiName" onchange={handleConfigChange}></lightning-input>
